name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Live hosted URL for API & app (leave default to use Vercel URL)"
        required: false
        default: "https://khel-galli-ecsu.vercel.app"
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies & Build Web Assets
        run: |
          npm ci
          npm run build

      - name: Configure Capacitor & Generate Android Project
        env:
          APP_URL_INPUT: ${{ github.event.inputs.app_url }}
        run: |
          if [ -n "$APP_URL_INPUT" ]; then
            node -e "
              const fs = require('fs');
              const cfg = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
              cfg.server.url = process.env.APP_URL_INPUT;
              fs.writeFileSync('capacitor.config.json', JSON.stringify(cfg, null, 2));
            "
          fi
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android
          npx cap sync android

      - name: Apply App Icons to Android Resources
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "android/app/src/main/res/$dir"
            cp public/pwa-512x512.png "android/app/src/main/res/$dir/ic_launcher.png"
            cp public/pwa-maskable-512x512.png "android/app/src/main/res/$dir/ic_launcher_round.png"
            cp public/pwa-maskable-512x512.png "android/app/src/main/res/$dir/ic_launcher_foreground.png"
          done

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KINGS-RELOAD-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
